services:
  - type: web
    name: it-support-copilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false          # you enter this manually in Render dashboard
      - key: TAVILY_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: it-support-rag
      - key: PINECONE_NAMESPACE
        value: company-kb
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: APP_ENV
        value: production
