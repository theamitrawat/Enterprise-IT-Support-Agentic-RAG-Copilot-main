services:
  - type: web
    name: enterprise-it-support-copilot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: copilot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CHROMA_DB_PATH
        value: /var/data/chroma_db
      - key: AUDIT_DB_PATH
        value: /var/data/audit.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
