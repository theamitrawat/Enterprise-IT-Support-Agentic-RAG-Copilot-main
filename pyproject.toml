    "jinja2==3.1.6",
    "langchain==1.3.16",
    "langchain-chroma==0.2.4",
    "langchain-community==0.4.2",
    "langchain-core==1.6.0",
    "langchain-groq==1.1.3",
    "langchain-tavily==0.2.18",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.11",
    "pydantic-settings==2.10.1",
    "pypdf==6.16.2",
    "python-docx==1.2.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.20",
